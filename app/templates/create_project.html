<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Dự Án Mới</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
    <header class="header">
        <h1>⏱️ Tạo Dự Án Mới</h1>
    </header>

    <main class="main-content">
        <form id="projectForm">
            <div class="form-group">
                <label>Tên Dự Án <span style="color: red">*</span></label>
                <input type="text" id="projectName" required placeholder="Tên dự án..." />
            </div>
            <div class="form-group">
                <label>Mô Tả</label>
                <textarea id="projectDescription" rows="3" placeholder="Mô tả dự án..."></textarea>
            </div>
            <div class="form-actions" style="text-align: right; margin-top: 20px;">
                <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Hủy</button>
                <button type="submit" class="btn btn-primary">Tạo Dự Án</button>
            </div>
        </form>
    </main>

    <script src="assets/js/api.js"></script>
    <script>
        // Hàm tạo dự án mới
        document.getElementById('projectForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const projectName = document.getElementById("projectName").value;
            const projectDescription = document.getElementById("projectDescription").value;

            if (!projectName) {
                alert("Tên dự án không được để trống!");
                return;
            }

            const projectData = {
                name: projectName,
                description: projectDescription,
            };

            try {
                // Gọi API tạo dự án
                const newProject = await api.createProject(projectData);
                if (newProject && newProject.id) {
                    alert("Dự án đã được tạo thành công!");

                    // Lưu project ID vào localStorage để quản lý sau khi tạo dự án
                    localStorage.setItem('current_project_id', newProject.id);
                    
                    // Sau khi tạo thành công, chuyển hướng đến trang quản lý dự án
                    window.location.href = 'dashboard.html'; // Hoặc trang khác của bạn
                }
            } catch (error) {
                console.error("Lỗi tạo dự án:", error);
                alert("Lỗi tạo dự án: " + error.message);
            }
        });
    </script>
</body>
</html>
