<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Dự án - Time Tracking</title>
    
    <link rel="stylesheet" href="/static/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS Riêng cho trang Projects --- */
        
        /* Layout Grid 2 cột */
        .project-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }

        /* Tùy chỉnh Card */
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .card-header h3 { margin: 0; font-size: 1.25rem; border: none; padding: 0; }
        .card-header i { font-size: 1.2rem; }

        /* Màu sắc phân biệt Project vs Task */
        .theme-project .card-header i { color: var(--primary); }
        .theme-task .card-header i { color: var(--success); }

        /* Danh sách (Scrollable) */
        .list-wrapper {
            margin-top: 20px;
        }
        .list-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .list-container {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 5px; /* Tránh thanh cuộn đè nội dung */
        }
        /* Tùy chỉnh thanh cuộn */
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-thumb { background-color: #ddd; border-radius: 3px; }

        /* Item trong danh sách */
        .list-item { 
            background: #fff; 
            border: 1px solid #eee; 
            padding: 15px; 
            margin-bottom: 12px; 
            border-radius: 8px; 
            transition: all 0.2s ease;
            position: relative;
            border-left: 4px solid transparent; /* Viền trái chờ active */
        }
        
        .list-item:hover {
            transform: translateX(3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-color: #ddd;
        }

        /* Item Project: Viền trái xanh dương */
        .theme-project .list-item { border-left-color: var(--primary); }
        /* Item Task: Viền trái xanh lá */
        .theme-task .list-item { border-left-color: var(--success); }

        .list-item h4 { margin: 0 0 5px 0; color: #2c3e50; font-size: 1rem; font-weight: 700; }
        .list-item p { margin: 0; font-size: 0.9rem; color: #666; line-height: 1.4; }
        
        .item-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .project-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    
    <header>
        <div class="container">
            <div style="display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-clock fa-lg"></i>
                <h1 style="margin: 0;">Time Tracker</h1>
            </div>
            <nav>
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="projects.html" class="active"><i class="fa-solid fa-list-check"></i> Projects</a>
                <a href="tracking.html"><i class="fa-solid fa-stopwatch"></i> Tracking</a>
                <a href="report.html"><i class="fa-solid fa-chart-pie"></i> Report</a>
                <a href="statistics.html"><i class="fa-solid fa-chart-line"></i> Statistics</a>
            </nav>
            <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
        </div>
    </header>

    <div class="container">
        <h2 class="mt-20 mb-20">Quản lý Dự án & Công việc</h2>
        
        <div class="project-grid">
            
            <div class="column-project theme-project">
                <div class="card">
                    <div class="card-header">
                        <i class="fa-solid fa-folder-plus"></i>
                        <h3>Tạo Dự án Mới</h3>
                    </div>
                    <form id="createProjectForm">
                        <div class="form-group">
                            <label>Tên Dự án <span style="color:red">*</span></label>
                            <div style="position: relative;">
                                <input type="text" id="projectName" class="form-control" required placeholder="Ví dụ: Website E-commerce" style="padding-left: 35px;">
                                <i class="fa-solid fa-tag" style="position: absolute; left: 12px; top: 12px; color: #999;"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Mô tả ngắn</label>
                            <textarea id="projectDescription" class="form-control" rows="2" placeholder="Mô tả mục tiêu dự án..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">
                            <i class="fa-solid fa-plus"></i> Thêm Dự án
                        </button>
                    </form>
                </div>

                <div class="list-wrapper">
                    <div class="list-title"><i class="fa-solid fa-layer-group"></i> Danh sách Dự án</div>
                    <div id="projectList" class="list-container">
                        <p class="text-muted text-center" style="padding: 20px;">Đang tải dữ liệu...</p>
                    </div>
                </div>
            </div>

            <div class="column-task theme-task">
                <div class="card">
                    <div class="card-header">
                        <i class="fa-solid fa-square-check"></i>
                        <h3>Tạo Công việc (Task)</h3>
                    </div>
                    <form id="taskForm">
                        <div class="form-group">
                            <label>Chọn Dự án <span style="color:red">*</span></label>
                            <div style="position: relative;">
                                <select id="taskProjectSelect" class="form-control" required style="padding-left: 35px;">
                                    <option value="">-- Đang tải dự án... --</option>
                                </select>
                                <i class="fa-solid fa-folder" style="position: absolute; left: 12px; top: 12px; color: #999;"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Tên Công việc <span style="color:red">*</span></label>
                            <div style="position: relative;">
                                <input type="text" id="taskName" class="form-control" required placeholder="Ví dụ: Thiết kế Database" style="padding-left: 35px;">
                                <i class="fa-solid fa-pen" style="position: absolute; left: 12px; top: 12px; color: #999;"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Chi tiết</label>
                            <textarea id="taskDescription" class="form-control" rows="2" placeholder="Ghi chú kỹ thuật, yêu cầu..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-success" style="width: 100%;">
                            <i class="fa-solid fa-check"></i> Thêm Task
                        </button>
                    </form>
                </div>

                <div class="list-wrapper">
                    <div class="list-title"><i class="fa-solid fa-list-ul"></i> Danh sách Công việc</div>
                    <div id="taskList" class="list-container">
                        <div style="text-align: center; padding: 30px; background: #fff; border: 1px dashed #ccc; border-radius: 8px; color: #777;">
                            <i class="fa-solid fa-arrow-left fa-2x" style="margin-bottom: 10px; display: block;"></i>
                            Hãy chọn một <strong>Dự án</strong> bên trái (nút Xem Task) <br>để hiển thị công việc tại đây.
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="/static/assets/js/api.js"></script>
    <script src="/static/assets/js/app.js"></script>
    <script src="/static/assets/js/projects.js"></script>
    <script src="/static/assets/js/event-bus.js"></script>
    
    <script>
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm("Bạn có chắc chắn muốn đăng xuất?")) api.logout();
        });
    </script>
</body>
</html>
