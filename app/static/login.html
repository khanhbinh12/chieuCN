<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Time Tracking</title>
    <!-- Correct link to the styles.css -->
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Đăng nhập</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Nhập email của bạn">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu:</label>
                <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu">
            </div>
            <button type="submit" class="btn btn-primary">Đăng nhập</button>
        </form>
        <p class="text-center mt-20">
            Chưa có tài khoản? <a href="register.html" class="text-link">Đăng ký ngay</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // TODO: Gọi API đăng nhập
            console.log('Login:', email, password);
            
            // Giả lập lưu JWT vào localStorage
            // localStorage.setItem('jwt_token', 'fake_token_here');
            
            // Chuyển đến dashboard
            // window.location.href = 'dashboard.html';
        });
    </script>

   <script src="static/js/app.js"></script>
<script src="assets/js/login.js"></script>

</body>
</html>
