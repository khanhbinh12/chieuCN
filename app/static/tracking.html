
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracking PRO</title>
    
    <link rel="stylesheet" href="/static/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        /* Dark Mode */
        body.dark-mode {
            background: #1a1a2e;
            color: #eee;
        }
        body.dark-mode .card {
            background: #16213e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        body.dark-mode .form-control, 
        body.dark-mode select {
            background: #0f3460;
            color: #eee;
            border-color: #2d4a6e;
        }
        body.dark-mode .timer-display {
            color: #00d4ff;
        }
        body.dark-mode .history-item {
            border-bottom-color: #2d4a6e;
        }
        body.dark-mode .history-item:hover {
            background: #1f3a5f;
        }

        /* Timer Display */
        .timer-wrapper {
            max-width: 700px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        .timer-display {
            font-size: 5rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #2c3e50;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            transition: color 0.3s;
        }
        
        .timer-display.running {
            color: #27ae60;
            text-shadow: 0 0 20px rgba(39, 174, 96, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* Selection Area */
        .selection-area {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #eee;
            text-align: left;
        }

        body.dark-mode .selection-area {
            background: #0f3460;
            border-color: #2d4a6e;
        }

        /* Control Buttons */
        .control-btn {
            font-size: 1.2rem;
            padding: 12px 40px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        
        .btn-start { 
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); 
            border: none; 
        }
        .btn-stop { 
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%); 
            border: none; 
        }

        /* Note Input */
        #noteInput {
            border: none;
            border-bottom: 2px solid #eee;
            border-radius: 0;
            background: transparent;
            text-align: center;
            font-size: 1rem;
            padding: 10px;
        }
        #noteInput:focus {
            box-shadow: none;
            border-bottom-color: var(--primary);
        }

        /* History Items */
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }
        .history-item:hover { 
            background-color: #fafafa; 
        }
        .history-item.selected {
            background-color: #e3f2fd;
        }
        
        .history-time { 
            font-family: monospace; 
            font-weight: 600; 
            color: #555; 
            font-size: 0.8rem; 
            margin-top: 5px; 
            color: #95a5a6;
        }
        .history-duration { 
            background: #eef2f7; 
            color: #2c3e50; 
            padding: 4px 10px; 
            border-radius: 12px; 
            font-size: 0.85rem; 
            font-weight: 600; 
        }
        .running-badge {
            background: #e8f5e9 !important;
            color: #27ae60 !important;
            font-weight: 700;
        }

        .entry-note {
            padding: 2px 5px;
            min-height: 20px;
        }
        .entry-note:hover {
            background: #f0f0f0;
            border-radius: 3px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            padding: 5px 10px;
            font-size: 1rem;
        }
        .btn-icon:hover {
            color: #c0392b;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dark-mode-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Chart Container */
        .chart-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        /* Load More Button */
        #loadMoreBtn {
            display: block;
            margin: 20px auto;
            padding: 10px 30px;
        }

        /* Keyboard Shortcuts Help */
        .shortcuts-help {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
        }
        .shortcuts-help.show {
            display: block;
        }
    </style>
</head>
<body>
    
    <header>
        <div class="container">
            <div style="display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-clock fa-lg"></i>
                <h1 style="margin: 0;">Time Tracker PRO</h1>
            </div>
            <nav>
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="projects.html"><i class="fa-solid fa-list-check"></i> Projects</a>
                <a href="tracking.html" class="active"><i class="fa-solid fa-stopwatch"></i> Tracking</a>
                <a href="report.html"><i class="fa-solid fa-chart-pie"></i> Report</a>
                <a href="statistics.html"><i class="fa-solid fa-chart-line"></i> Statistics</a>
            </nav>
            <button class="logout-btn" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
            </button>
        </div>
    </header>

    <div class="container">
        
        <!-- Timer Section -->
        <div class="timer-wrapper">
            <div class="card">
                <div class="toolbar">
                    <h3 style="margin: 0;"><i class="fa-regular fa-clock"></i> Bấm giờ công việc</h3>
                    
                    <div style="display:flex; gap:15px; align-items:center;">
                        <!-- Dark Mode Toggle -->
                        <div class="dark-mode-toggle">
                            <i class="fa-solid fa-moon"></i>
                            <label class="switch">
                                <input type="checkbox" id="darkModeToggle">
                                <span class="slider round"></span>
                            </label>
                        </div>

                        <!-- Export Buttons -->
                        <button id="exportCsvBtn" class="btn btn-outline-secondary" title="Export CSV">
                            <i class="fa-solid fa-file-csv"></i> CSV
                        </button>
                        <button id="exportExcelBtn" class="btn btn-outline-success" title="Export Excel">
                            <i class="fa-solid fa-file-excel"></i> Excel
                        </button>
                    </div>
                </div>
                
                <div class="selection-area">
                    <div class="form-group">
                        <label><i class="fa-solid fa-folder"></i> Chọn Dự án:</label>
                        <select id="projectSelect" class="form-control">
                            <option value="">-- Đang tải... --</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fa-solid fa-list-ul"></i> Chọn Công việc (Task):</label>
                        <div style="display: flex; gap: 10px;">
                            <select id="taskSelect" class="form-control" disabled>
                                <option value="">-- Vui lòng chọn Dự án trước --</option>
                            </select>
                            <button id="newTaskBtn" class="btn btn-outline-secondary" title="Tạo task nhanh">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>

                    <div id="newTaskForm" style="display: none; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px;">
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="newTaskTitle" class="form-control" placeholder="Nhập tên công việc mới...">
                            <button id="saveTaskBtn" class="btn btn-primary">Lưu</button>
                        </div>
                    </div>
                </div>

                <div id="currentTaskLabel"></div>
                <div id="timerDisplay" class="timer-display">00:00:00</div>

                <div style="max-width: 80%; margin: 0 auto 30px auto;">
                    <input type="text" id="noteInput" class="form-control" placeholder="✏️ Bạn đang làm chi tiết gì? (Ghi chú)">
                </div>

                <div class="control-panel" style="display: flex; justify-content: center; gap: 20px;">
                    <button id="startBtn" class="btn btn-success control-btn btn-start">
                        <i class="fa-solid fa-play"></i> BẮT ĐẦU
                    </button>
                    <button id="stopBtn" class="btn btn-danger control-btn btn-stop" style="display: none;">
                        <i class="fa-solid fa-stop"></i> DỪNG LẠI
                    </button>
                </div>

                <div style="margin-top:20px; font-size:0.85rem; color:#888;">
                    💡 <strong>Phím tắt:</strong> Space = Start/Stop | Ctrl+E = Export | Ctrl+D = Dark Mode
                </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="card chart-container">
            <h3 style="text-align:center; margin-bottom:20px;">
                <i class="fa-solid fa-chart-pie"></i> Phân bổ thời gian theo Task
            </h3>
            <canvas id="chartCanvas"></canvas>
        </div>

        <!-- History Section -->
        <div class="card" style="max-width: 900px; margin: 0 auto;">
            <div class="toolbar">
                <h3 style="margin: 0;"><i class="fa-solid fa-history"></i> Lịch sử hoạt động</h3>
                
                <div style="display:flex; gap:10px; align-items:center;">
                    <span style="font-size:0.9rem; color:#888;">
                        Đã chọn: <strong id="selectedCount">0</strong>
                    </span>
                    <button id="bulkDeleteBtn" class="btn btn-danger btn-sm" style="display:none;">
                        <i class="fa-solid fa-trash"></i> Xóa đã chọn
                    </button>
                </div>
            </div>

            <div id="historyList" style="margin-top: 10px;">
                <p class="text-muted text-center" style="padding: 20px;">
                    <i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...
                </p>
            </div>

            <button id="loadMoreBtn" class="btn btn-secondary" style="display:none;">
                <i class="fa-solid fa-chevron-down"></i> Tải thêm
            </button>
        </div>

    </div>

    <!-- CSS for Toggle Switch -->
    <style>
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2196F3;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>

    <script src="/static/assets/js/api.js"></script>
    <script src="/static/assets/js/app.js"></script>
    <script src="/static/assets/js/tracking.js"></script>
    <script src="/static/assets/js/event-bus.js"></script>
    
    <script>
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm("Đăng xuất?")) api.logout();
        });
    </script>
</body>
</html>
