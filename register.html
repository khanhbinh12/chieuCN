<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />
    <title>Đăng ký - Time Tracking App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/register.css" />
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-form">
            <h1>Time Tracking</h1>
            <h2>Đăng ký tài khoản mới</h2>

            <form id="registerForm" autocomplete="off">
                <div class="form-group">
                    <label for="reg_username">Tên đăng nhập:</label>
                    <input
                        type="text"
                        id="reg_username"
                        name="username"
                        required
                        placeholder="Ví dụ: kbinh123"
                        autocomplete="username"
                    />
                </div>

                <div class="form-group">
                    <label for="reg_email">Email:</label>
                    <input
                        type="email"
                        id="reg_email"
                        name="email"
                        placeholder="email@example.com"
                        autocomplete="email"
                    />
                </div>

                <div class="form-group">
                    <label for="reg_fullname">Họ tên:</label>
                    <!-- Lưu ý: name="fullName" phải khớp với code trong auth.js -->
                    <input
                        type="text"
                        id="reg_fullname"
                        name="fullName"
                        placeholder="Nguyễn Văn A"
                        autocomplete="name"
                    />
                </div>

                <div class="form-group">
                    <label for="reg_password">Mật khẩu:</label>
                    <input
                        type="password"
                        id="reg_password"
                        name="password"
                        required
                        autocomplete="new-password"
                    />
                </div>

                <!-- MỚI: Nhập lại mật khẩu -->
                <div class="form-group">
                    <label for="reg_confirm_password">Nhập lại mật khẩu:</label>
                    <input
                        type="password"
                        id="reg_confirm_password"
                        name="confirmPassword"
                        required
                        autocomplete="new-password"
                    />
                </div>

                <!-- Nút đăng ký -->
                <button
                    type="submit"
                    id="registerBtn"
                    class="btn btn-primary"
                    style="width: 100%;"
                >
                    Đăng ký
                </button>
            </form>

            <p style="margin-top: 15px; text-align: center;">
                Đã có tài khoản?
                <a
                    href="login.html"
                    style="color: #3498db; text-decoration: none;"
                >
                    Đăng nhập
                </a>
            </p>
        </div>
    </div>

    <!-- QUAN TRỌNG: Thứ tự load Script -->
    <!-- 1. Load thư viện API trước -->
    <script src="assets/js/api.js"></script>
    <!-- 2. Load logic xử lý Đăng ký/Đăng nhập sau -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
